# Release request: publish the latest customer site, portal routing fix and booking email support.
name = "nordisk-mobilvask"
main = "src/site-entry.js"
compatibility_date = "2026-07-20"

[assets]
directory = "./public"
binding = "ASSETS"
# Routes are handled by the application. Do not redirect internal .html fetches.
html_handling = "none"
run_worker_first = [ "/", "/index*", "/api/*", "/portal*" ]

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "nordisk-mobilvask-test-db"
database_id = "0ba2ef68-d701-4e7b-afe0-9cc32d7bdf5d"
migrations_dir = "migrations"

# Existing booking-email entry point is retained through site-entry.js.
[[send_email]]
name = "EMAIL"
